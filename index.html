<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RK Store</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#f7fbf7;color:#222}
:root{--g:#176b24;--o:#ff6f00}header{background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:20}
.nav{max-width:1200px;margin:auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:27px;font-weight:900}.rk{color:var(--g)}.store{color:var(--o)}
.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}.green{background:var(--g);color:#fff}.orange{background:var(--o);color:#fff}
.hero{background:linear-gradient(135deg,#fff7ed,#eef8ee);padding:40px 18px}.hero-in{max-width:1200px;margin:auto}.hero h1{color:var(--g);font-size:clamp(34px,6vw,56px);margin-bottom:10px}.hero p{color:#666;line-height:1.6}
.container{max-width:1200px;margin:auto;padding:28px 18px}.cats{display:flex;gap:8px;overflow:auto;margin:15px 0 25px}.cat{white-space:nowrap;padding:9px 14px;border:1px solid #ddd;background:#fff;border-radius:20px;cursor:pointer}.cat.active{background:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.product{background:#fff;border:1px solid #eee;border-radius:15px;overflow:hidden;box-shadow:0 5px 18px #0001}.pic{height:190px;background:#eee;display:flex;align-items:center;justify-content:center;position:relative}.pic img{width:100%;height:100%;object-fit:cover}.noimg{font-size:60px}
.body{padding:15px}.body h3{margin-bottom:5px}.muted{color:#777;font-size:13px}.price{color:var(--o);font-size:21px;font-weight:bold;margin:9px 0}
select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:9px}.add{width:100%}
.cart{background:#fff;border-radius:16px;padding:20px;box-shadow:0 5px 18px #0001}.cart h2{color:var(--g);margin-bottom:12px}.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.qty button{width:30px;height:30px;border:1px solid #ddd;background:#fff;border-radius:6px}.total{display:flex;justify-content:space-between;margin-top:17px;font-size:20px;font-weight:bold}
.empty{text-align:center;color:#777;padding:25px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.pic{height:145px}.body{padding:10px}}
</style>
</head><body>
<header><div class="nav"><div class="logo"><span class="rk">RK</span><span class="store"> STORE</span></div><a class="btn green" href="#cart">🛒 Cart <span id="count">0</span></a></div></header>
<section class="hero"><div class="hero-in"><h1>RK Store</h1><p>दाल, चावल और किराना सामान KG में। साबुन, shampoo और home-use सामान Piece में।</p></div></section>
<main class="container"><h2 style="color:#176b24">🛒 Products</h2><div class="cats"><button class="cat active" data-c="All">All</button><button class="cat" data-c="Rice & Dal">Rice & Dal</button><button class="cat" data-c="Atta & Flour">Atta & Flour</button><button class="cat" data-c="Oil & Spices">Oil & Spices</button><button class="cat" data-c="Snacks">Snacks</button><button class="cat" data-c="Beverages">Beverages</button><button class="cat" data-c="Home & Personal Care">Home & Personal Care</button></div><div id="products" class="grid"><div class="empty">Products loading...</div></div>
<section id="cart" class="cart" style="margin-top:28px"><h2>🛒 My Cart <span id="count2">0</span></h2><div id="cartList"><div class="empty">Cart खाली है।</div></div><div id="bottom" class="total" style="display:none"><span>Total ₹<span id="total">0</span></span><a id="wa" class="btn orange" target="_blank">📲 WhatsApp Order</a></div></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import{getFirestore,collection,getDocs}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBHYFfuoS3YYZBCzOb3QZFeJnZRhqLLhM8",authDomain:"rk-store-29fe3.firebaseapp.com",projectId:"rk-store-29fe3",storageBucket:"rk-store-29fe3.firebasestorage.app",messagingSenderId:"917562412698",appId:"1:917562412698:web:3206fed06abf017a431923"});
const db=getFirestore(app);let products=[],cat="All",cart=JSON.parse(localStorage.getItem("rkCart")||"[]");
const esc=x=>String(x??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function weights(p){return Array.isArray(p.weights)&&p.weights.length?p.weights:[{label:"1kg",grams:1000}]}
function unitPrice(p,w){if(p.unit==="piece")return Number(p.pricePerPiece??p.price??0);return Math.round(Number(p.pricePerKg??p.price??0)*Number(w.grams)/1000)}
function render(){let a=cat==="All"?products:products.filter(p=>p.category===cat);document.getElementById("products").innerHTML=a.length?a.map(p=>{let ws=weights(p),imgs=Array.isArray(p.images)?p.images:(p.image?[p.image]:[]),w=ws[0],pr=unitPrice(p,w);return `<article class="product"><div class="pic">${imgs[0]?`<img src="${esc(imgs[0])}" alt="${esc(p.name)}">`:`<span class="noimg">${p.unit==="piece"?"🧼":"🌾"}</span>`}</div><div class="body"><h3>${esc(p.name)}</h3><div class="muted">${esc(p.category||"")} · ${p.unit==="piece"?"Piece में":"KG में"}</div><div class="price">₹<span id="pr-${esc(p.id)}">${pr}</span> ${p.unit==="piece"?"/piece":""}</div><select id="w-${esc(p.id)}" onchange="changePrice('${esc(p.id)}')">${p.unit==="piece"?[1,2,3,4].map(n=>`<option value="${n}">${n} Piece${n>1?"s":""}</option>`).join(""):ws.map((x,i)=>`<option value="${i}">${esc(x.label)}</option>`).join("")}</select><button class="btn green add" onclick="add('${esc(p.id)}')">🛒 Add to Cart</button></div></article>`}).join(""):'<div class="empty">इस category में कोई product नहीं है।</div>'}
window.changePrice=id=>{let p=products.find(x=>x.id===id),v=Number(document.getElementById("w-"+id).value),w=p.unit==="piece"?{grams:1000}:weights(p)[v];document.getElementById("pr-"+id).textContent=unitPrice(p,w)}
window.add=id=>{let p=products.find(x=>x.id===id),v=Number(document.getElementById("w-"+id).value),w=p.unit==="piece"?{label:v+" Piece",grams:1000*v}:{...weights(p)[v],label:weights(p)[v].label};let price=unitPrice(p,w),key=id+"-"+w.label,x=cart.find(a=>a.key===key);x?x.qty++:cart.push({key,name:p.name,weight:w.label,price,qty:1});save();document.getElementById("cart").scrollIntoView({behavior:"smooth"})}
window.q=(k,d)=>{let x=cart.find(a=>a.key===k);if(!x)return;x.qty+=d;if(x.qty<1)cart=cart.filter(a=>a.key!==k);save()}
function save(){localStorage.setItem("rkCart",JSON.stringify(cart));drawCart()}
function drawCart(){let c=cart.reduce((s,x)=>s+x.qty,0),t=cart.reduce((s,x)=>s+x.price*x.qty,0);document.getElementById("count").textContent=c;document.getElementById("count2").textContent=c;document.getElementById("total").textContent=t;document.getElementById("bottom").style.display=cart.length?"flex":"none";document.getElementById("cartList").innerHTML=cart.length?cart.map(x=>`<div class="item"><div><b>${esc(x.name)}</b><br><small>${esc(x.weight)} × ${x.qty} = ₹${x.price*x.qty}</small></div><div class="qty"><button onclick="q('${esc(x.key)}',-1)">−</button> ${x.qty} <button onclick="q('${esc(x.key)}',1)">+</button></div></div>`).join(""):'<div class="empty">Cart खाली है।</div>';document.getElementById("wa").href="https://wa.me/919771059673?text="+encodeURIComponent("नमस्ते RK Store, मेरा order:\n\n"+cart.map((x,i)=>`${i+1}. ${x.name} - ${x.weight} × ${x.qty} = ₹${x.price*x.qty}`).join("\n")+"\n\nTotal: ₹"+t)}
document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));b.classList.add("active");cat=b.dataset.c;render()});
try{products=(await getDocs(collection(db,"products"))).docs.map(d=>({id:d.id,...d.data()}));render()}catch(e){document.getElementById("products").innerHTML='<div class="empty">❌ Products load नहीं हो रहे। Firestore rules check करें।</div>'}drawCart();
</script></body></html>
