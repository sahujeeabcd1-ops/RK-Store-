<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RK Store | Owner Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f8f4;color:#222}
:root{--green:#176b24;--orange:#ff6f00;--red:#d32f2f}
.hidden{display:none!important}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#eef8ee,#fff7ed)}
.box{width:100%;max-width:460px;background:#fff;padding:32px 24px;border-radius:22px;box-shadow:0 15px 50px #0002;text-align:center}
.logo{font-size:40px;font-weight:900;margin-bottom:8px}.rk{color:var(--green)}.store{color:var(--orange)}
.box h2{margin:8px 0}.muted{color:#777;margin-bottom:24px}
input,select{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin-bottom:14px}
.btn{border:0;padding:13px 18px;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
.green{background:var(--green);color:#fff}.orange{background:var(--orange);color:#fff}.red{background:var(--red);color:#fff}
.full{width:100%}.error{color:var(--red);font-weight:bold;margin-top:12px}
header{background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10}
.header-inner{max-width:1100px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.header-logo{font-size:24px;font-weight:900}.header-logo span{color:var(--orange)}
.container{max-width:1100px;margin:auto;padding:25px 16px}
.title h1{color:var(--green);margin-bottom:5px}.title p{color:#666}
.notice{background:#fff4e8;border-left:5px solid var(--orange);padding:14px;margin:20px 0;border-radius:8px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}
.card,.panel{background:#fff;border-radius:16px;padding:22px;box-shadow:0 5px 20px #0000000d;margin-bottom:20px}
.card h3{color:#666;font-size:14px}.card strong{display:block;color:var(--green);font-size:28px;margin-top:8px}
.panel h2{color:var(--green);margin-bottom:18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full-field{grid-column:1/-1}
label{display:block;font-weight:bold;margin-bottom:6px}
.product-list{display:grid;gap:12px}.product{border:1px solid #eee;border-radius:13px;padding:16px;display:flex;justify-content:space-between;gap:15px;align-items:center}
.product h3{margin-bottom:5px}.product p{color:#666;font-size:14px}.price{color:var(--orange);font-weight:bold;font-size:20px;margin-top:6px}
.empty{text-align:center;color:#777;padding:20px}
.loading{text-align:center;color:#666;padding:20px}
@media(max-width:700px){.cards{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full-field{grid-column:auto}.product{flex-direction:column;align-items:flex-start}.header-logo{font-size:21px}}
</style>
</head>
<body>

<div id="loginPage" class="login-page">
  <div class="box">
    <div class="logo"><span class="rk">RK</span><span class="store"> STORE</span></div>
    <h2>Shop Owner Admin</h2>
    <p class="muted">Firebase Owner Login</p>

    <input id="email" type="email" placeholder="Owner Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" class="btn green full">🔐 Login</button>
    <div id="loginError" class="error"></div>
  </div>
</div>

<div id="adminPage" class="hidden">
<header>
  <div class="header-inner">
    <div class="header-logo"><span style="color:#176b24">RK</span> <span>STORE</span></div>
    <button id="logoutBtn" class="btn red">Logout</button>
  </div>
</header>

<main class="container">
  <div class="title">
    <h1>👋 Welcome, Shop Owner</h1>
    <p>RK Store के products यहाँ manage करें।</p>
  </div>

  <div class="notice">☁️ Products अब Firebase Firestore में online save होंगे।</div>

  <div class="cards">
    <div class="card"><h3>Total Products</h3><strong id="totalProducts">0</strong></div>
    <div class="card"><h3>Store</h3><strong>RK Store</strong></div>
    <div class="card"><h3>Delivery</h3><strong>₹5,000+</strong></div>
  </div>

  <div class="panel">
    <h2>➕ Add Product</h2>
    <div class="form-grid">
      <div>
        <label>Product Name</label>
        <input id="productName" type="text" placeholder="जैसे: Basmati Rice">
      </div>
      <div>
        <label>Price</label>
        <input id="productPrice" type="number" min="0" placeholder="जैसे: 120">
      </div>
      <div>
        <label>Category</label>
        <select id="productCategory">
          <option>Rice & Dal</option>
          <option>Atta & Flour</option>
          <option>Oil & Spices</option>
          <option>Snacks</option>
          <option>Beverages</option>
          <option>Home & Personal Care</option>
        </select>
      </div>
      <div>
        <label>Product Image URL</label>
        <input id="productImage" type="url" placeholder="https://...">
      </div>
      <div class="full-field">
        <button id="addBtn" class="btn green">➕ Add Product</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>🛒 Products</h2>
    <div id="productList" class="product-list"><div class="loading">Loading...</div></div>
  </div>
</main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import {
  getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBHYFfuoS3YYZBCzOb3QZFeJnZRhqLLhM8",
  authDomain: "rk-store-29fe3.firebaseapp.com",
  projectId: "rk-store-29fe3",
  storageBucket: "rk-store-29fe3.firebasestorage.app",
  messagingSenderId: "917562412698",
  appId: "1:917562412698:web:3206fed06abf017a431923",
  measurementId: "G-5DM9CZJ5B4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginPage = document.getElementById("loginPage");
const adminPage = document.getElementById("adminPage");
const loginError = document.getElementById("loginError");

document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    loginError.textContent = "❌ Email और Password दोनों डालें।";
    return;
  }

  loginError.textContent = "Login हो रहा है...";
  try {
    await signInWithEmailAndPassword(auth, email, password);
    loginError.textContent = "";
  } catch (e) {
    console.error(e);
    loginError.textContent = "❌ Email या Password गलत है।";
  }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
});

document.getElementById("addBtn").addEventListener("click", addProduct);

onAuthStateChanged(auth, user => {
  if (user) {
    loginPage.classList.add("hidden");
    adminPage.classList.remove("hidden");
    loadProducts();
  } else {
    adminPage.classList.add("hidden");
    loginPage.classList.remove("hidden");
  }
});

async function addProduct() {
  const name = document.getElementById("productName").value.trim();
  const price = document.getElementById("productPrice").value.trim();
  const category = document.getElementById("productCategory").value;
  const image = document.getElementById("productImage").value.trim();

  if (!name) return alert("Product name डालें।");
  if (!price) return alert("Product price डालें।");

  const btn = document.getElementById("addBtn");
  btn.disabled = true;
  btn.textContent = "Saving...";

  try {
    await addDoc(collection(db, "products"), {
      name,
      price: Number(price),
      category,
      image,
      createdAt: Date.now()
    });

    document.getElementById("productName").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productImage").value = "";

    await loadProducts();
    alert("✅ Product Firebase में save हो गया!");
  } catch (e) {
    console.error(e);
    alert("❌ Product save नहीं हुआ। Firestore Rules check करें।");
  } finally {
    btn.disabled = false;
    btn.textContent = "➕ Add Product";
  }
}

async function loadProducts() {
  const list = document.getElementById("productList");
  list.innerHTML = '<div class="loading">Products loading...</div>';

  try {
    const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
    const snap = await getDocs(q);
    document.getElementById("totalProducts").textContent = snap.size;

    if (snap.empty) {
      list.innerHTML = '<div class="empty">अभी कोई product नहीं है।</div>';
      return;
    }

    list.innerHTML = "";
    snap.forEach(item => {
      const p = item.data();
      const div = document.createElement("div");
      div.className = "product";

      const info = document.createElement("div");
      info.innerHTML = `
        <h3>${escapeHtml(p.name)}</h3>
        <p>${escapeHtml(p.category || "")}</p>
        <div class="price">₹${escapeHtml(String(p.price ?? ""))}</div>
      `;

      const del = document.createElement("button");
      del.className = "btn red";
      del.textContent = "🗑️ Delete";
      del.onclick = () => deleteProduct(item.id, p.name);

      div.appendChild(info);
      div.appendChild(del);
      list.appendChild(div);
    });
  } catch (e) {
    console.error(e);
    list.innerHTML = '<div class="empty">❌ Products load नहीं हुए। Firestore Rules check करें।</div>';
  }
}

async function deleteProduct(id, name) {
  if (!confirm(`"${name}" delete करना है?`)) return;

  try {
    await deleteDoc(doc(db, "products", id));
    await loadProducts();
  } catch (e) {
    console.error(e);
    alert("❌ Delete नहीं हुआ।");
  }
}

function escapeHtml(text) {
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
</script>
</body>
</html>
