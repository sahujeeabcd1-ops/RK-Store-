<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>RK Store Admin</title>
<style>
*{box-sizing:border-box}body{font-family:Arial;background:#f4f8f4;margin:0;color:#222}:root{--g:#176b24;--o:#ff6f00;--r:#d32f2f}.hidden{display:none!important}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#eef8ee,#fff7ed)}.box,.panel,.card{background:#fff;border-radius:16px;box-shadow:0 5px 20px #0001}.box{max-width:450px;width:100%;padding:35px;text-align:center}.logo{font-size:40px;font-weight:900}.rk{color:var(--g)}.store{color:var(--o)}input,select{width:100%;padding:12px;margin:6px 0 13px;border:1px solid #ddd;border-radius:9px;font-size:15px}.btn{border:0;padding:11px 16px;border-radius:9px;font-weight:bold;cursor:pointer}.green{background:var(--g);color:#fff}.orange{background:var(--o);color:#fff}.red{background:var(--r);color:#fff}.wrap{max-width:1150px;margin:auto;padding:25px 18px}.panel{padding:22px;margin-bottom:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 15px}.full{grid-column:1/-1}.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.weights{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:15px}.weights label{border:1px solid #ddd;border-radius:8px;padding:8px;background:#fafafa}.weights input{width:auto;margin:0 5px 0 0}.products{display:grid;gap:12px}.prod{background:#fff;border:1px solid #eee;border-radius:12px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.thumb{width:55px;height:55px;object-fit:cover;border-radius:7px;margin-right:5px}.actions{display:flex;gap:7px}.err{color:#d32f2f;font-weight:bold;margin-top:10px}@media(max-width:700px){.grid,.photos{grid-template-columns:1fr}.full{grid-column:auto}.prod{flex-direction:column;align-items:flex-start}}
</style></head><body>
<div id="login" class="login"><div class="box"><div class="logo"><span class="rk">RK</span><span class="store"> STORE</span></div><h2>Owner Admin</h2><p>सिर्फ Shop Owner के लिए</p><input id="pass" type="password" placeholder="Owner Password"><button id="loginBtn" class="btn green" style="width:100%">🔐 Login</button><div id="err" class="err"></div></div></div>
<div id="app" class="hidden"><header style="background:#fff;border-bottom:1px solid #ddd"><div class="wrap" style="display:flex;justify-content:space-between;padding-top:14px;padding-bottom:14px"><b style="font-size:24px"><span class="rk">RK</span><span class="store"> STORE</span></b><button id="logout" class="btn red">Logout</button></div></header>
<main class="wrap"><div class="panel"><h1 style="color:#176b24">➕ Add Product</h1><p style="color:#666">KG और Piece दोनों तरह के products add कर सकते हैं।</p><div class="grid">
<div><label>Product Name</label><input id="name" placeholder="Arhar Dal / Lux Soap"></div>
<div><label>Category</label><select id="category"><option>Rice & Dal</option><option>Atta & Flour</option><option>Oil & Spices</option><option>Snacks</option><option>Beverages</option><option>Home & Personal Care</option></select></div>
<div><label>Unit</label><select id="unit"><option value="kg">KG</option><option value="piece">Piece</option></select></div>
<div><label id="priceLabel">Price per KG</label><input id="price" type="number" min="0" placeholder="120"></div>
<div class="full"><label>Photos (1–4 image URLs)</label><div class="photos"><input id="im1" placeholder="Photo 1 URL"><input id="im2" placeholder="Photo 2 URL"><input id="im3" placeholder="Photo 3 URL"><input id="im4" placeholder="Photo 4 URL"></div></div>
<div id="kgBox" class="full"><label>Available Weights</label><div class="weights"><label><input type="checkbox" value="200" checked>200g</label><label><input type="checkbox" value="400" checked>400g</label><label><input type="checkbox" value="500" checked>500g</label><label><input type="checkbox" value="1000" checked>1kg</label><label><input type="checkbox" value="2000">2kg</label><label><input type="checkbox" value="5000">5kg</label></div></div>
<div class="full"><button id="save" class="btn green">➕ Add Product</button><button id="cancel" class="btn" style="display:none">Cancel</button></div>
</div></div>
<div class="panel"><h2 style="color:#176b24">🛒 Products <span id="total">0</span></h2><div id="list" class="products">Loading...</div></div></main></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import{getFirestore,collection,getDocs,addDoc,updateDoc,deleteDoc,doc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyBHYFfuoS3YYZBCzOb3QZFeJnZRhqLLhM8",authDomain:"rk-store-29fe3.firebaseapp.com",projectId:"rk-store-29fe3",storageBucket:"rk-store-29fe3.firebasestorage.app",messagingSenderId:"917562412698",appId:"1:917562412698:web:3206fed06abf017a431923"}));
const P="RK@2026";let edit=null,products=[];const $=id=>document.getElementById(id),esc=x=>String(x??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
$("unit").onchange=()=>{$("priceLabel").textContent=$("unit").value==="kg"?"Price per KG":"Price per Piece";$("kgBox").style.display=$("unit").value==="kg"?"block":"none"};
function show(){ $("login").classList.add("hidden");$("app").classList.remove("hidden");load()}
$("loginBtn").onclick=()=>{$("pass").value===P?(localStorage.setItem("rkLogin","1"),show()):$("err").textContent="❌ Password गलत है।"};$("logout").onclick=()=>{localStorage.removeItem("rkLogin");location.reload()};
function clear(){["name","price","im1","im2","im3","im4"].forEach(x=>$(x).value="");edit=null;$("save").textContent="➕ Add Product";$("cancel").style.display="none"}
$("cancel").onclick=clear;
function ws(){return[...document.querySelectorAll(".weights input:checked")].map(x=>({label:Number(x.value)>=1000?Number(x.value)/1000+"kg":x.value+"g",grams:Number(x.value)}))}
async function save(){let name=$("name").value.trim(),price=Number($("price").value),unit=$("unit").value;if(!name||price<0||!price){alert("Name और price डालें।");return}let images=["im1","im2","im3","im4"].map(x=>$(x).value.trim()).filter(Boolean),data={name,category:$("category").value,unit,images,updatedAt:serverTimestamp()};if(unit==="kg"){data.pricePerKg=price;data.weights=ws();if(!data.weights.length){alert("कम से कम एक weight चुनें।");return}}else data.pricePerPiece=price;try{if(edit)await updateDoc(doc(db,"products",edit),data);else{data.createdAt=serverTimestamp();await addDoc(collection(db,"products"),data)}alert(edit?"✅ Updated":"✅ Added");clear();load()}catch(e){console.error(e);alert("❌ Firebase save नहीं हुआ। Firestore rules check करें।")}}
$("save").onclick=save;
async function load(){try{products=(await getDocs(collection(db,"products"))).docs.map(d=>({id:d.id,...d.data()}));$("total").textContent=products.length;$("list").innerHTML=products.length?products.map(p=>`<div class="prod"><div><b>${esc(p.name)}</b><br><small>${esc(p.category||"")} · ${p.unit==="piece"?"Piece · ₹"+(p.pricePerPiece??0):"KG · ₹"+(p.pricePerKg??0)+"/kg"}</small><div>${(p.images||[]).slice(0,4).map(u=>`<img class="thumb" src="${esc(u)}">`).join("")}</div></div><div class="actions"><button class="btn orange" onclick="editP('${esc(p.id)}')">✏️ Edit</button><button class="btn red" onclick="delP('${esc(p.id)}')">🗑️ Delete</button></div></div>`).join(""):'<p style="text-align:center;color:#777">कोई product नहीं।</p>'}catch(e){$("list").textContent="❌ Products load नहीं हुए।"}}
window.editP=id=>{let p=products.find(x=>x.id===id);if(!p)return;edit=id;$("name").value=p.name||"";$("category").value=p.category||"Rice & Dal";$("unit").value=p.unit||"kg";$("unit").onchange();$("price").value=p.unit==="piece"?p.pricePerPiece:p.pricePerKg;(p.images||[]).forEach((u,i)=>$("im"+(i+1)).value=u);if(p.weights){let a=p.weights.map(x=>Number(x.grams));document.querySelectorAll(".weights input").forEach(x=>x.checked=a.includes(Number(x.value)))}$("save").textContent="💾 Update Product";$("cancel").style.display="inline-block";scrollTo({top:0,behavior:"smooth"})};
window.delP=async id=>{if(!confirm("Product delete करें?"))return;try{await deleteDoc(doc(db,"products",id));load()}catch(e){alert("Delete नहीं हुआ।")}};
if(localStorage.getItem("rkLogin")==="1")show();
</script></body></html>
